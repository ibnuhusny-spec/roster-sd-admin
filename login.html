<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - ROSTERKU</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.45) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(67, 56, 202, 0.35) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(14, 165, 233, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.08); }
        }
        .animate-glow {
            animation: pulseGlow 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden">

    <!-- Ambient Glow Orbs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none animate-glow"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none animate-glow" style="animation-delay: 2.5s;"></div>

    <main class="w-full max-w-md relative z-10 my-8">
        
        <!-- Modern Glass Container -->
        <div class="backdrop-blur-2xl bg-white/95 rounded-[2.5rem] p-8 sm:p-10 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.4)] border border-white/60 relative overflow-hidden">
            
            <!-- Top Gradient Accent -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-sky-500"></div>

            <!-- Header with Icon Badge -->
            <div class="text-center mb-8">
                <div class="relative w-20 h-20 mx-auto mb-4 flex items-center justify-center">
                    <div class="absolute inset-0 bg-blue-500/20 rounded-2xl blur-lg animate-pulse"></div>
                    <div class="relative w-18 h-18 bg-gradient-to-tr from-blue-600 to-indigo-700 text-white rounded-2xl p-4 shadow-xl flex items-center justify-center animate-float">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                </div>

                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 border border-blue-200/60 text-blue-700 text-xs font-semibold tracking-wide mb-2">
                    <span>Portal Administrator</span>
                </div>
                
                <h1 class="font-heading text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                    Masuk Admin
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">
                    Kelola data master guru, kelas, mapel & jadwal
                </p>
            </div>

            <!-- Login Form -->
            <form id="formLogin" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Email Administrator
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                            </svg>
                        </div>
                        <input type="email" id="emailAdmin" placeholder="admin@sekolah.sch.id" required
                            class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-2xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 text-slate-800 text-sm font-medium transition outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Kata Sandi
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input type="password" id="passwordAdmin" placeholder="••••••••" required
                            class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-2xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 text-slate-800 text-sm font-medium transition outline-none">
                    </div>
                </div>

                <!-- Error Message Banner -->
                <div id="pesanError" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2">
                    <svg class="w-4 h-4 flex-shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>Email atau password salah! Periksa kembali akun Anda.</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmitLogin"
                    class="group relative flex items-center justify-center gap-2 w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-700 hover:via-indigo-700 hover:to-blue-800 text-white font-bold text-base shadow-[0_10px_25px_-5px_rgba(37,99,235,0.4)] hover:shadow-[0_15px_30px_-5px_rgba(37,99,235,0.5)] transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 mt-2">
                    <span>Masuk ke Panel</span>
                    <span class="inline-block transition-transform duration-200 group-hover:translate-x-1">➔</span>
                </button>
            </form>

            <!-- Navigation Links -->
            <div class="mt-8 pt-5 border-t border-slate-100 flex items-center justify-between text-xs font-semibold">
                <a href="index.html" class="inline-flex items-center gap-1.5 text-slate-500 hover:text-blue-600 transition-colors py-1 px-2 rounded-lg hover:bg-slate-50">
                    <span>⬅️</span>
                    <span>Halaman Depan</span>
                </a>
                <a href="lihat_jadwal.html" class="inline-flex items-center gap-1.5 text-blue-600 hover:text-blue-800 transition-colors py-1 px-2 rounded-lg hover:bg-blue-50">
                    <span>Lihat Roster</span>
                    <span>➔</span>
                </a>
            </div>

        </div>

        <!-- Footer / Credits -->
        <footer class="mt-6 text-center text-xs text-slate-400">
            <p>ROSTERKU Pro &bull; Dikembangkan oleh <span class="font-bold text-slate-300">IBNU HUSNY</span></p>
        </footer>

    </main>

    <script type="module">
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { app } from "./firebase-config.js"; 

        const auth = getAuth(app);
        const formLogin = document.getElementById("formLogin");
        const pesanError = document.getElementById("pesanError");
        const btnSubmit = document.getElementById("btnSubmitLogin");

        formLogin.addEventListener("submit", (event) => {
            event.preventDefault();
            
            const email = document.getElementById("emailAdmin").value.trim();
            const password = document.getElementById("passwordAdmin").value;

            // Efek loading tombol
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Memeriksa Akun...</span>
            `;
            pesanError.classList.add("hidden");

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    btnSubmit.innerHTML = `<span>✅ Berhasil! Mengalihkan...</span>`;
                    window.location.href = "kelola_data.html"; 
                })
                .catch((error) => {
                    console.error("Gagal login:", error.message);
                    pesanError.classList.remove("hidden");
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `
                        <span>Masuk ke Panel</span>
                        <span class="inline-block transition-transform duration-200 group-hover:translate-x-1">➔</span>
                    `;
                });
        });
    </script>

</body>
</html>
