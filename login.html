<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin Jadwal</title>
    <style>
        /* Desain dasar agar form login ada di tengah layar */
        body { 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f0f2f5; 
            margin: 0; 
        }
        .login-container { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 300px; 
            text-align: center; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #0d6efd; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
        }
        button:hover { 
            background: #0b5ed7; 
        }
        .error-msg { 
            color: red; 
            font-size: 14px; 
            margin-top: 10px; 
            display: none; /* Sembunyikan pesan error di awal */
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login Admin</h2>
        <form id="formLogin">
            <input type="email" id="emailAdmin" placeholder="Email" required>
            <input type="password" id="passwordAdmin" placeholder="Password" required>
            <button type="submit">Masuk</button>
            <p id="pesanError" class="error-msg">Email atau password salah!</p>
        </form>
    </div>

    <script type="module">
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // Pastikan nama file config ini sesuai
        import { app } from "./firebase-config.js"; 

        const auth = getAuth(app);
        const formLogin = document.getElementById("formLogin");
        const pesanError = document.getElementById("pesanError");

        // Ketika tombol "Masuk" ditekan
        formLogin.addEventListener("submit", (event) => {
            event.preventDefault(); // Mencegah halaman reload otomatis
            
            const email = document.getElementById("emailAdmin").value;
            const password = document.getElementById("passwordAdmin").value;

            // Memeriksa kecocokan ke server Firebase
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Jika cocok, arahkan ke halaman kelola data
                    alert("Login berhasil!");
                    window.location.href = "kelola_data.html"; 
                })
                .catch((error) => {
                    // Jika salah, munculkan tulisan error warna merah
                    console.error("Gagal login:", error.message);
                    pesanError.style.display = "block";
                });
        });
    </script>

</body>
</html>
