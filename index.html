<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ROSTERKU PRO - Aplikasi Jadwal Pelajaran Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
        }
        html, body {
            background-color: #07090E !important;
            color: #F3F4F6 !important;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }
        input, select, textarea {
            color-scheme: dark;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Gradien Teks Emas Mewah */
        .text-gold-gradient {
            background: linear-gradient(135deg, #FFF7D6 0%, #F59E0B 35%, #D97706 70%, #FDE047 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(245, 158, 11, 0.3));
        }

        .text-gold-light {
            background: linear-gradient(135deg, #FFFFFF 0%, #FDE68A 50%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Border Emas Mewah */
        .gold-border {
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .gold-border-glow {
            border: 1px solid rgba(245, 158, 11, 0.5);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
        }

        /* Efek Glassmorphism Kegelapan Emas */
        .gold-glass-card {
            background: rgba(15, 20, 32, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.25);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(245, 158, 11, 0.08);
        }

        /* Animasi Aura Bernafas Logo */
        @keyframes goldPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 30px rgba(245, 158, 11, 0.25), inset 0 0 15px rgba(245, 158, 11, 0.2);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 60px rgba(245, 158, 11, 0.45), inset 0 0 30px rgba(245, 158, 11, 0.35);
            }
        }

        .animate-gold-pulse {
            animation: goldPulse 4s ease-in-out infinite;
        }

        /* Shimmering Button Emas */
        .btn-gold {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 50%, #B45309 100%);
            color: #0F172A;
            font-weight: 800;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
        }

        .btn-gold:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.5);
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 50%, #D97706 100%);
        }

        .btn-gold:active {
            transform: translateY(1px);
        }

        .btn-gold::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(255, 255, 255, 0.5) 50%, transparent 55%);
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        /* Background Particle Effect */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.6) 0%, rgba(245, 158, 11, 0) 70%);
            pointer-events: none;
            animation: floatParticle 8s ease-in-out infinite alternate;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) scale(1); opacity: 0.3; }
            100% { transform: translateY(-40px) scale(1.3); opacity: 0.7; }
        }
    </style>
</head>
<body class="min-h-screen relative flex items-center justify-center p-4 md:p-8 bg-[#07090E]">

    <!-- Ambient Particles & Glowing Orbs -->
    <div class="particle w-96 h-96 -top-20 -left-20" style="animation-delay: 0s;"></div>
    <div class="particle w-80 h-80 top-1/2 -right-20" style="animation-delay: 2s;"></div>
    <div class="particle w-64 h-64 -bottom-10 left-1/3" style="animation-delay: 4s;"></div>

    <div class="w-full max-w-2xl relative z-10 my-auto">
        
        <!-- Main Luxury Card -->
        <div class="gold-glass-card rounded-3xl p-8 md:p-12 text-center relative overflow-hidden">
            
            <!-- Top Status Bar & Clock -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-2 mb-8 pb-6 border-b border-amber-500/20 text-xs font-semibold text-amber-200/80 tracking-wider uppercase">
                <div class="flex items-center gap-2 bg-amber-500/10 px-3 py-1.5 rounded-full border border-amber-500/30">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Sistem Roster Digital</span>
                </div>
                <div id="liveClock" class="font-mono text-amber-400 font-bold text-sm tracking-widest bg-black/40 px-4 py-1.5 rounded-full border border-amber-500/20 shadow-inner">
                    00:00:00 WITA
                </div>
            </div>

            <!-- Header Title -->
            <div class="space-y-3 mb-8">
                <h1 class="font-cinzel text-4xl md:text-5xl font-black tracking-widest text-gold-gradient drop-shadow-lg uppercase">
                    ROSTERKU
                </h1>
                <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-gradient-to-r from-amber-500/20 via-yellow-500/30 to-amber-500/20 border border-amber-400/50 shadow-md">
                    <span class="text-amber-300 font-bold text-xs md:text-sm tracking-widest uppercase">PRO EDITION v1.0</span>
                </div>
            </div>

            <!-- School Info Badge -->
            <div class="mb-10 inline-block max-w-full">
                <div class="bg-gradient-to-r from-black/60 via-amber-950/40 to-black/60 px-6 py-3 rounded-2xl border border-amber-500/30 shadow-inner">
                    <p class="text-xs uppercase tracking-widest text-amber-400/70 font-semibold mb-1">Sekolah Terdaftar</p>
                    <h2 id="teksNamaSekolah" class="text-lg md:text-2xl font-extrabold text-gold-light tracking-wide truncate">
                        Memuat Data...
                    </h2>
                </div>
            </div>

            <!-- Glowing Logo Frame -->
            <div class="relative w-44 h-44 md:w-52 md:h-52 mx-auto mb-12 flex items-center justify-center rounded-full bg-gradient-to-b from-amber-500/10 to-transparent p-4 animate-gold-pulse gold-border-glow">
                <img id="imgLogo" src="logo1.png" alt="Logo Sekolah" class="max-w-full max-h-full object-contain filter drop-shadow-[0_10px_20px_rgba(245,158,11,0.4)]">
            </div>

            <!-- Action Navigation Buttons -->
            <div class="space-y-4 max-w-md mx-auto">
                <a href="lihat_jadwal.html" class="btn-gold block w-full py-4 px-8 rounded-2xl text-lg md:text-xl tracking-wider uppercase font-extrabold shadow-2xl flex items-center justify-center gap-3">
                    <span>📅</span> LIHAT JADWAL PELAJARAN
                </a>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <a href="lihat_jadwal.html?alarm=true" class="py-3 px-4 rounded-xl bg-amber-950/40 hover:bg-amber-900/60 border border-amber-500/30 text-amber-300 font-bold text-sm tracking-wide transition flex items-center justify-center gap-2 hover:border-amber-400">
                        <span>🔔</span> Alarm Guru
                    </a>
                    <a href="login.html" class="py-3 px-4 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-amber-500/30 text-amber-200/90 font-bold text-sm tracking-wide transition flex items-center justify-center gap-2 hover:border-amber-400">
                        <span>🔒</span> Login Admin
                    </a>
                </div>
            </div>

            <!-- Luxury Gold Footer Signature -->
            <div class="mt-12 pt-6 border-t border-amber-500/15 flex flex-col items-center">
                <p class="text-[11px] uppercase tracking-widest text-amber-400/60 font-semibold mb-1">Developed & Designed by</p>
                <div class="px-5 py-1.5 rounded-full bg-gradient-to-r from-amber-500/10 via-amber-400/20 to-amber-500/10 border border-amber-500/30 shadow-md">
                    <span class="font-cinzel text-base md:text-lg font-black tracking-widest text-gold-gradient">IBNU HUSNY</span>
                </div>
            </div>

        </div>

    </div>

    <!-- Firebase & Dynamic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        let firebaseConfig = {
            apiKey: "AIzaSyAu8st2VRsNFyzC8UR8TDq8821y4_TVHVk",
            authDomain: "roster-sekolah-sd.firebaseapp.com",
            projectId: "roster-sekolah-sd",
            storageBucket: "roster-sekolah-sd.firebasestorage.app",
            messagingSenderId: "819380185646",
            appId: "1:819380185646:web:39ae854591ca40f0498dbf"
        };

        try {
            const module = await import("./firebase-config.js");
            if (module && module.firebaseConfig) { firebaseConfig = module.firebaseConfig; }
        } catch (error) {
            console.warn("Menjalankan mode preview/lokal.");
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function muatSplashScreen() {
            const teksNamaSekolah = document.getElementById('teksNamaSekolah');
            try {
                const docSnap = await getDoc(doc(db, "pengaturan", "info_sekolah"));
                if (docSnap.exists() && docSnap.data().nama_sekolah) {
                    teksNamaSekolah.innerText = docSnap.data().nama_sekolah;
                } else {
                    teksNamaSekolah.innerText = "SD Negeri Default";
                }
            } catch (error) {
                teksNamaSekolah.innerText = "Roster Sekolah Digital";
            }
        }

        muatSplashScreen();

        // Live Realtime Clock
        function updateLiveClock() {
            const clockEl = document.getElementById('liveClock');
            if (!clockEl) return;
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            clockEl.innerText = `${hrs}:${mins}:${secs} WITA`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();
    </script>
</body>
</html>
