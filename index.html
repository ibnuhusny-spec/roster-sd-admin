<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROSTERKU - Jadwal Pelajaran & Bel Sekolah Modern</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <link rel="apple-touch-icon" href="logo1.png">
    
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Outfit"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(14, 165, 233, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.08); }
        }
        .animate-glow {
            animation: pulseGlow 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden">

    <!-- Ambient Glow Orbs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none animate-glow"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none animate-glow" style="animation-delay: 2.5s;"></div>

    <main class="w-full max-w-lg relative z-10 my-8">
        
        <!-- Modern Glass Container -->
        <div class="backdrop-blur-2xl bg-white/95 rounded-[2.5rem] p-8 sm:p-10 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.35)] border border-white/60 text-center relative overflow-hidden">
            
            <!-- Subtle Top Accent Line -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-sky-500"></div>

            <!-- Top Pill Badge -->
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-50 border border-blue-200/60 text-blue-700 text-xs font-semibold tracking-wide mb-6 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-blue-600 animate-ping"></span>
                <span>Jadwal Pelajaran & Bel Sekolah Digital</span>
            </div>

            <!-- Logo Section with Floating Effect & Pedestal -->
            <div class="relative w-36 h-36 mx-auto mb-6 flex items-center justify-center">
                <div class="absolute inset-0 bg-gradient-to-tr from-blue-500/20 to-indigo-500/30 rounded-full blur-xl animate-pulse"></div>
                <div class="relative w-32 h-32 bg-white rounded-3xl p-3 shadow-xl border border-slate-100 flex items-center justify-center animate-float">
                    <img id="imgLogo" src="logo1.png" alt="Logo Sekolah" class="max-w-full max-h-full object-contain filter drop-shadow-md">
                </div>
            </div>

            <!-- Title & School Name -->
            <h1 class="font-heading text-4xl sm:text-5xl font-extrabold tracking-tight mb-2 flex items-center justify-center gap-2">
                <span class="bg-gradient-to-r from-slate-900 via-blue-900 to-indigo-950 bg-clip-text text-transparent">ROSTERKU</span>
                <span class="text-xs sm:text-sm font-bold bg-gradient-to-r from-amber-500 to-yellow-500 text-white px-2.5 py-1 rounded-full shadow-sm align-middle tracking-normal">Pro</span>
            </h1>

            <h2 id="teksNamaSekolah" class="text-base sm:text-lg font-semibold text-slate-600 mb-6 leading-relaxed px-2">
                Memuat Data Sekolah...
            </h2>

            <!-- Features Highlights Chips -->
            <div class="grid grid-cols-3 gap-2 mb-8 py-3 px-2 bg-slate-50/80 rounded-2xl border border-slate-100 text-[11px] sm:text-xs font-medium text-slate-600">
                <div class="flex flex-col items-center justify-center p-1 gap-1">
                    <span class="text-lg">🔔</span>
                    <span class="font-bold text-slate-800">Alarm Bel</span>
                    <span class="text-[10px] text-slate-400">Otomatis Per Jam</span>
                </div>
                <div class="flex flex-col items-center justify-center p-1 gap-1 border-x border-slate-200">
                    <span class="text-lg">⚡</span>
                    <span class="font-bold text-slate-800">Kilat 0 ms</span>
                    <span class="text-[10px] text-slate-400">Cache Instan</span>
                </div>
                <div class="flex flex-col items-center justify-center p-1 gap-1">
                    <span class="text-lg">📱</span>
                    <span class="font-bold text-slate-800">PWA Siap</span>
                    <span class="text-[10px] text-slate-400">HP & Laptop</span>
                </div>
            </div>

            <!-- Primary Action Button -->
            <a href="lihat_jadwal.html" class="group relative flex items-center justify-center gap-3 w-full py-4 px-8 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-700 hover:via-indigo-700 hover:to-blue-800 text-white font-bold text-base sm:text-lg shadow-[0_10px_25px_-5px_rgba(37,99,235,0.4)] hover:shadow-[0_15px_30px_-5px_rgba(37,99,235,0.5)] transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                <span>Buka Jadwal Pelajaran</span>
                <span class="inline-block transition-transform duration-200 group-hover:translate-x-1.5">➔</span>
            </a>

            <!-- Admin Link -->
            <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-center">
                <a href="login.html" class="inline-flex items-center gap-2 text-xs sm:text-sm font-semibold text-slate-500 hover:text-blue-700 transition-colors py-1 px-3 rounded-lg hover:bg-slate-50">
                    <span>🔒</span>
                    <span>Masuk sebagai Admin Pengelola</span>
                </a>
            </div>

        </div>

        <!-- Footer / Credits -->
        <footer class="mt-6 text-center text-xs text-slate-400 space-y-1">
            <p>Dikembangkan dengan ❤️ oleh <span class="font-bold text-slate-300 tracking-wide">IBNU HUSNY</span></p>
            <p class="text-[10px] text-slate-500">Aplikasi Jadwal & Bel Pelajaran Sekolah Pintar</p>
        </footer>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        let firebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "PROJECT_ID.firebaseapp.com",
            projectId: "PROJECT_ID",
            storageBucket: "PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        try {
            const module = await import("./firebase-config.js");
            if (module && module.firebaseConfig) { firebaseConfig = module.firebaseConfig; }
        } catch (error) {
            console.warn("Menjalankan mode preview/lokal.");
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Pre-warm (panaskan) cache seluruh jadwal pelajaran di background tanpa menunggu
        try {
            getDocs(collection(db, "jadwal_pelajaran")).then(snap => {
                const list = [];
                snap.forEach(d => list.push({ id: d.id, ...d.data() }));
                if (list.length > 0) {
                    localStorage.setItem('cache_semua_jadwal', JSON.stringify(list));
                }
            }).catch(() => {});
        } catch(e) {}

        async function muatSplashScreen() {
            const teksNamaSekolah = document.getElementById('teksNamaSekolah');
            try {
                const cached = localStorage.getItem('cache_info_sekolah');
                if (cached) teksNamaSekolah.innerText = cached;
            } catch(e) {}

            if (firebaseConfig.apiKey === "API_KEY_ANDA") {
                teksNamaSekolah.innerText = "SD Negeri Default (Mode Demo)";
                return; 
            }
            try {
                const docSnap = await getDoc(doc(db, "pengaturan", "info_sekolah"));
                if (docSnap.exists()) {
                    const nama = docSnap.data().nama_sekolah || "SD Negeri Default";
                    teksNamaSekolah.innerText = nama;
                    try { localStorage.setItem('cache_info_sekolah', nama); } catch(e) {}
                } else {
                    teksNamaSekolah.innerText = "Selamat Datang!";
                }
            } catch (error) {
                if (!teksNamaSekolah.innerText || teksNamaSekolah.innerText === "Memuat Data...") {
                    teksNamaSekolah.innerText = "Aplikasi Roster (Mode Offline)";
                }
            }
        }

        muatSplashScreen();
    </script>
</body>
</html>
